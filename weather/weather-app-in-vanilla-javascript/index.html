<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Weather App</title>
  </head>
  <body>
    <div class="app-main">
      <div class="searchInputBox">
        <input
          type="text"
          id="input-box"
          class="input-box"
          placeholder="Enter city name..."
          autocomplete="off"
        />
      </div>

      <div class="weather-body">
        <div class="location-details">
          <div class="city" id="city">Search your City</div>
          <div class="date" id="date">Please keep your internet access</div>
        </div>

        <div class="weather-status">
          <div class="temp" id="temp">Weather&deg;C</div>
          <div class="min-max" id="min-max">
            Creator is Kabir Mohammad
          </div>
          <div class="weather" id="weather">A Developer</div>
          <div id="img"></div>
        </div>
      </div>
    </div>
    <div>
      <span class="aboutme"
        >The creator of this Weather Web is : Kabir Mohammad</span
      >
    </div>
    <script src="app.js"></script>
  </body>
</html>
