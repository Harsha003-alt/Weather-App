<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeteoVision | Weather Forecast by V Harshavardhan Reddy</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* 
  MeteoVision Weather App
  Designed and Developed by V Harshavardhan Reddy
  Copyright © 2023 - All rights reserved
*/

:root {
  --primary-color: #4361ee;
  --secondary-color: #3f37c9;
  --accent-color: #4895ef;
  --light-color: #f8f9fa;
  --dark-color: #212529;
  --success-color: #4cc9f0;
  --warning-color: #f72585;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  overflow-x: hidden;
  color: var(--light-color);
  position: relative;
}

.background-gradient {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
  z-index: -2;
  transition: background 1s ease;
}

.particles {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 0;
  margin-bottom: 30px;
  animation: fadeIn 1s ease-in-out;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 1.5rem;
}

.logo i {
  font-size: 2rem;
  color: var(--accent-color);
}

.logo span {
  color: var(--accent-color);
}

.search-box {
  display: flex;
  align-items: center;
  background: rgba(255, 255, 255, 0.2);
  border-radius: 30px;
  padding: 5px 15px;
  backdrop-filter: blur(5px);
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
  transition: all 0.3s ease;
}

.search-box:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
}

.search-box input {
  background: transparent;
  border: none;
  outline: none;
  color: var(--light-color);
  font-size: 1rem;
  padding: 8px;
  width: 200px;
}

.search-box input::placeholder {
  color: rgba(255, 255, 255, 0.7);
}

.search-box button {
  background: transparent;
  border: none;
  color: var(--light-color);
  cursor: pointer;
  font-size: 1rem;
  transition: transform 0.3s ease;
}

.search-box button:hover {
  transform: scale(1.1);
}

.main-content {
  display: flex;
  flex-direction: column;
  gap: 30px;
}

.current-weather {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 20px;
  padding: 30px;
  backdrop-filter: blur(10px);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.1);
}

.weather-info {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.weather-info h2 {
  font-size: 2rem;
  font-weight: 600;
}

.date {
  font-size: 1rem;
  opacity: 0.8;
}

.temperature {
  display: flex;
  align-items: flex-start;
  font-size: 4rem;
  font-weight: 300;
}

.temperature .unit {
  font-size: 2rem;
  margin-top: 10px;
}

.weather-condition {
  font-size: 1.2rem;
  text-transform: capitalize;
}

.weather-icon i {
  font-size: 8rem;
  color: var(--accent-color);
  animation: pulse 2s infinite;
}

.weather-details {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 20px;
}

.detail-card {
  background: rgba(255, 255, 255, 0.1);
  border-radius: 15px;
  padding: 20px;
  display: flex;
  align-items: center;
  gap: 15px;
  backdrop-filter: blur(5px);
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
  transition: all 0.3s ease;
}

.detail-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
}

.detail-card i {
  font-size: 1.5rem;
  color: var(--accent-color);
}

.detail-card .value {
  font-size: 1.5rem;
  font-weight: 500;
}

.detail-card .label {
  font-size: 0.9rem;
  opacity: 0.8;
}

.forecast, .hourly-forecast {
  background: rgba(255, 255, 255, 0.1);
  border-radius: 20px;
  padding: 20px;
  backdrop-filter: blur(10px);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.1);
}

.forecast h3, .hourly-forecast h3 {
  margin-bottom: 20px;
  font-size: 1.3rem;
  font-weight: 500;
}

.forecast-cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
}

.forecast-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 15px;
  padding: 15px;
  transition: all 0.3s ease;
}

.forecast-card:hover {
  transform: translateY(-5px);
  background: rgba(255, 255, 255, 0.2);
}

.forecast-day {
  font-weight: 500;
  margin-bottom: 10px;
}

.forecast-icon {
  font-size: 2rem;
  margin: 10px 0;
  color: var(--accent-color);
}

.forecast-temp {
  display: flex;
  gap: 10px;
}

.forecast-temp span {
  font-size: 1.1rem;
}

.high-temp {
  font-weight: 500;
}

.low-temp {
  opacity: 0.7;
}

.hourly-container {
  display: flex;
  gap: 15px;
  overflow-x: auto;
  padding-bottom: 10px;
}

.hourly-container::-webkit-scrollbar {
  height: 6px;
}

.hourly-container::-webkit-scrollbar-track {
  background: rgba(255, 255, 255, 0.1);
  border-radius: 10px;
}

.hourly-container::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.3);
  border-radius: 10px;
}

.hourly-card {
  min-width: 80px;
  display: flex;
  flex-direction: column;
  align-items: center;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 15px;
  padding: 15px;
  transition: all 0.3s ease;
}

.hourly-card:hover {
  transform: translateY(-5px);
  background: rgba(255, 255, 255, 0.2);
}

.hourly-time {
  font-size: 0.9rem;
  margin-bottom: 10px;
}

.hourly-icon {
  font-size: 1.5rem;
  margin: 5px 0;
  color: var(--accent-color);
}

.hourly-temp {
  font-size: 1.1rem;
  font-weight: 500;
}

.loading {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.animated-icons {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: -1;
}

.cloud {
  position: absolute;
  color: rgba(255, 255, 255, 0.6);
  animation: float 15s infinite linear;
}

.cloud-1 {
  font-size: 5rem;
  top: 15%;
  left: 10%;
  animation-delay: 0s;
}

.cloud-2 {
  font-size: 3rem;
  top: 25%;
  right: 15%;
  animation-delay: 3s;
  animation-duration: 20s;
}

.cloud-3 {
  font-size: 4rem;
  bottom: 20%;
  left: 20%;
  animation-delay: 5s;
  animation-duration: 25s;
}

.sun {
  position: absolute;
  font-size: 4rem;
  color: rgba(255, 255, 255, 0.4);
  top: 10%;
  right: 10%;
  animation: pulse 4s infinite alternate;
}

.animate-slide-in {
  animation: slideIn 0.8s ease-out forwards;
  opacity: 0;
}

.animate-slide-in:nth-child(1) {
  animation-delay: 0.2s;
}

.animate-slide-in:nth-child(2) {
  animation-delay: 0.4s;
}

.animate-slide-in:nth-child(3) {
  animation-delay: 0.6s;
}

.animate-slide-in:nth-child(4) {
  animation-delay: 0.8s;
}

@keyframes float {
  0% {
    transform: translateX(0) translateY(0);
  }
  50% {
    transform: translateX(50px) translateY(-20px);
  }
  100% {
    transform: translateX(100px) translateY(0);
  }
}

@keyframes pulse {
  0% {
    transform: scale(1);
    opacity: 1;
  }
  50% {
    transform: scale(1.1);
    opacity: 0.8;
  }
  100% {
    transform: scale(1);
    opacity: 1;
  }
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(-20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes slideIn {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (max-width: 768px) {
  .header {
    flex-direction: column;
    gap: 20px;
  }
  .current-weather {
    flex-direction: column;
    text-align: center;
  }
  .weather-icon {
    margin-top: 20px;
  }
  .forecast-cards {
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  }
  .hourly-card {
    min-width: 70px;
  }
}
</style>
</head>
<body>
<div class="background-gradient"></div>
<div class="particles" id="particles-js"></div>
<div class="container">
  <header class="header">
    <div class="logo">
      <i class="fas fa-cloud-sun"></i>
      <h1>Meteo<span>Vision</span></h1>
    </div>
    <div class="search-box">
      <input type="text" id="city-input" placeholder="Search city...">
      <button id="search-btn"><i class="fas fa-search"></i></button>
    </div>
  </header>
  <main class="main-content">
    <div class="current-weather animate-slide-in">
      <div class="weather-info">
        <h2 id="city-name">Loading...</h2>
        <div class="date" id="current-date"></div>
        <div class="temperature">
          <span id="current-temp">--</span>
          <span class="unit">°C</span>
        </div>
        <div class="weather-condition" id="weather-condition"></div>
      </div>
      <div class="weather-icon">
        <i class="fas fa-cloud" id="weather-icon"></i>
      </div>
    </div>
    <div class="weather-details animate-slide-in">
      <div class="detail-card">
        <i class="fas fa-wind"></i>
        <div>
          <span class="value" id="wind-speed">--</span>
          <span class="label">km/h</span>
        </div>
      </div>
      <div class="detail-card">
        <i class="fas fa-tint"></i>
        <div>
          <span class="value" id="humidity">--</span>
          <span class="label">%</span>
        </div>
      </div>
      <div class="detail-card">
        <i class="fas fa-compress-arrows-alt"></i>
        <div>
          <span class="value" id="pressure">--</span>
          <span class="label">hPa</span>
        </div>
      </div>
    </div>
    <div class="forecast animate-slide-in">
      <h3>5-Day Forecast</h3>
      <div class="forecast-cards" id="forecast-container">
        <div class="loading">Loading forecast...</div>
      </div>
    </div>
    <div class="hourly-forecast animate-slide-in">
      <h3>Hourly Forecast</h3>
      <div class="hourly-container" id="hourly-container">
        <div class="loading">Loading hourly data...</div>
      </div>
    </div>
  </main>
  <div class="animated-icons">
    <i class="fas fa-cloud cloud cloud-1"></i>
    <i class="fas fa-cloud cloud cloud-2"></i>
    <i class="fas fa-cloud cloud cloud-3"></i>
    <i class="fas fa-sun sun"></i>
  </div>
</div>

<!-- Developer Credit Footer -->
<footer style="text-align: center; padding: 20px; color: rgba(255,255,255,0.7); font-size: 0.9rem;">
  Designed and Developed by V Harshavardhan Reddy
</footer>

<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
<script>
/* 
  MeteoVision Weather App - JavaScript
  Created by V Harshavardhan Reddy
*/

document.addEventListener('DOMContentLoaded', function() {
  // Initialize particles.js
  particlesJS('particles-js', {
    particles: {
      number: {
        value: 80,
        density: {
          enable: true,
          value_area: 800
        }
      },
      color: {
        value: "#ffffff"
      },
      shape: {
        type: "circle",
        stroke: {
          width: 0,
          color: "#000000"
        }
      },
      opacity: {
        value: 0.3,
        random: true,
        anim: {
          enable: true,
          speed: 1,
          opacity_min: 0.1,
          sync: false
        }
      },
      size: {
        value: 3,
        random: true,
        anim: {
          enable: true,
          speed: 2,
          size_min: 0.1,
          sync: false
        }
      },
      line_linked: {
        enable: true,
        distance: 150,
        color: "#ffffff",
        opacity: 0.2,
        width: 1
      },
      move: {
        enable: true,
        speed: 1,
        direction: "none",
        random: true,
        straight: false,
        out_mode: "out",
        bounce: false,
        attract: {
          enable: false,
          rotateX: 600,
          rotateY: 1200
        }
      }
    },
    interactivity: {
      detect_on: "canvas",
      events: {
        onhover: {
          enable: true,
          mode: "grab"
        },
        onclick: {
          enable: true,
          mode: "push"
        },
        resize: true
      },
      modes: {
        grab: {
          distance: 140,
          line_linked: {
            opacity: 0.5
          }
        },
        push: {
          particles_nb: 4
        }
      }
    },
    retina_detect: true
  });

  // API key
  const apiKey = "6c402faf9118d3ec2a645f357dca0535";
  
  // DOM elements
  const cityInput = document.getElementById('city-input');
  const searchBtn = document.getElementById('search-btn');
  const cityName = document.getElementById('city-name');
  const currentDate = document.getElementById('current-date');
  const currentTemp = document.getElementById('current-temp');
  const weatherCondition = document.getElementById('weather-condition');
  const weatherIcon = document.getElementById('weather-icon');
  const windSpeed = document.getElementById('wind-speed');
  const humidity = document.getElementById('humidity');
  const pressure = document.getElementById('pressure');
  const forecastContainer = document.getElementById('forecast-container');
  const hourlyContainer = document.getElementById('hourly-container');

  // Weather icons mapping
  const weatherIcons = {
    'clear': 'fa-sun',
    'clouds': 'fa-cloud',
    'rain': 'fa-cloud-rain',
    'drizzle': 'fa-cloud-rain',
    'thunderstorm': 'fa-bolt',
    'snow': 'fa-snowflake',
    'mist': 'fa-smog',
    'smoke': 'fa-smog',
    'haze': 'fa-smog',
    'dust': 'fa-smog',
    'fog': 'fa-smog',
    'sand': 'fa-smog',
    'ash': 'fa-smog',
    'squall': 'fa-wind',
    'tornado': 'fa-wind'
  };

  // Fetch weather data from API
  async function fetchWeatherData(city) {
    try {
      // Fetch current weather
      const currentResponse = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&units=metric&appid=6c402faf9118d3ec2a645f357dca0535`);
      if (!currentResponse.ok) {
        throw new Error('City not found. Please try another location.');
      }
      const currentData = await currentResponse.json();
      
      // Fetch 5-day forecast
      const forecastResponse = await fetch(`https://api.openweathermap.org/data/2.5/forecast?q=${city}&units=metric&appid=6c402faf9118d3ec2a645f357dca0535`);
      if (!forecastResponse.ok) {
        throw new Error('Could not fetch forecast data.');
      }
      const forecastData = await forecastResponse.json();
      
      return { current: currentData, forecast: forecastData };
    } catch (error) {
      throw error;
    }
}

  // Update current weather UI
  function updateCurrentWeather(data) {
    cityName.textContent = data.name;
    currentTemp.textContent = Math.round(data.main.temp);
    weatherCondition.textContent = data.weather[0].description;
    windSpeed.textContent = Math.round(data.wind.speed * 3.6); // Convert m/s to km/h
    humidity.textContent = data.main.humidity;
    pressure.textContent = data.main.pressure;
    
    // Update weather icon
    const weatherMain = data.weather[0].main.toLowerCase();
    weatherIcon.className = `fas ${weatherIcons[weatherMain] || 'fa-cloud'}`;
    
    // Update date
    const now = new Date();
    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    currentDate.textContent = now.toLocaleDateString('en-US', options);
    
    // Update background gradient based on weather
    updateBackground(weatherMain, data.main.temp);
  }

  // Update forecast UI
  function updateForecast(data) {
    forecastContainer.innerHTML = '';
    
    // Group forecast by day (API returns data every 3 hours)
    const dailyForecast = {};
    data.list.forEach(item => {
      const date = new Date(item.dt * 1000);
      const day = date.toLocaleDateString('en-US', { weekday: 'short' });
      
      if (!dailyForecast[day]) {
        dailyForecast[day] = {
          temps: [],
          weather: [],
          date: date
        };
      }
      
      dailyForecast[day].temps.push(item.main.temp);
      dailyForecast[day].weather.push(item.weather[0].main.toLowerCase());
    });
    
    // Display next 5 days
    const days = Object.keys(dailyForecast).slice(0, 5);
    days.forEach(day => {
      const forecast = dailyForecast[day];
      const maxTemp = Math.round(Math.max(...forecast.temps));
      const minTemp = Math.round(Math.min(...forecast.temps));
      
      // Get most frequent weather condition for the day
      const weatherCount = {};
      forecast.weather.forEach(condition => {
        weatherCount[condition] = (weatherCount[condition] || 0) + 1;
      });
      const mostFrequentWeather = Object.keys(weatherCount).reduce((a, b) => 
        weatherCount[a] > weatherCount[b] ? a : b
      );
      
      const forecastCard = document.createElement('div');
      forecastCard.className = 'forecast-card';
      forecastCard.innerHTML = `
        <div class="forecast-day">${day}</div>
        <i class="fas ${weatherIcons[mostFrequentWeather] || 'fa-cloud'} forecast-icon"></i>
        <div class="forecast-temp">
          <span class="high-temp">${maxTemp}°</span>
          <span class="low-temp">${minTemp}°</span>
        </div>
      `;
      forecastContainer.appendChild(forecastCard);
    });
  }

  // Update hourly forecast UI
  function updateHourlyForecast(data) {
    hourlyContainer.innerHTML = '';
    
    // Display next 24 hours (8 data points, 3 hours apart)
    const hourlyData = data.list.slice(0, 8);
    
    hourlyData.forEach(item => {
      const time = new Date(item.dt * 1000);
      const temp = Math.round(item.main.temp);
      const weather = item.weather[0].main.toLowerCase();
      
      const hourlyCard = document.createElement('div');
      hourlyCard.className = 'hourly-card';
      hourlyCard.innerHTML = `
        <div class="hourly-time">${time.toLocaleTimeString('en-US', { hour: 'numeric', hour12: true })}</div>
        <i class="fas ${weatherIcons[weather] || 'fa-cloud'} hourly-icon"></i>
        <div class="hourly-temp">${temp}°</div>
      `;
      hourlyContainer.appendChild(hourlyCard);
    });
  }

  // Update background gradient based on weather and temperature
  function updateBackground(weather, temp) {
    const bgGradient = document.querySelector('.background-gradient');
    let gradient;
    
    if (weather.includes('rain') || weather.includes('drizzle')) {
      gradient = 'linear-gradient(135deg, #4b6cb7, #182848)';
    } else if (weather.includes('thunderstorm')) {
      gradient = 'linear-gradient(135deg, #0f2027, #203a43, #2c5364)';
    } else if (weather.includes('snow')) {
      gradient = 'linear-gradient(135deg, #e0eafc, #cfdef3)';
    } else if (weather.includes('cloud')) {
      gradient = 'linear-gradient(135deg, #757f9a, #d7dde8)';
    } else if (temp > 30) {
      gradient = 'linear-gradient(135deg, #ff4e50, #f9d423)';
    } else if (temp < 10) {
      gradient = 'linear-gradient(135deg, #00d2ff, #3a7bd5)';
    } else {
      gradient = 'linear-gradient(135deg, #4361ee, #3f37c9)';
    }
    
    bgGradient.style.background = gradient;
  }

  // Handle search
  async function handleSearch() {
    const city = cityInput.value.trim();
    if (!city) {
      alert('Please enter a city name');
      return;
    }
    
    try {
      // Show loading state
      cityName.textContent = 'Loading...';
      currentTemp.textContent = '--';
      weatherCondition.textContent = '';
      forecastContainer.innerHTML = '<div class="loading">Loading forecast...</div>';
      hourlyContainer.innerHTML = '<div class="loading">Loading hourly data...</div>';
      
      const data = await fetchWeatherData(city);
      updateCurrentWeather(data.current);
      updateForecast(data.forecast);
      updateHourlyForecast(data.forecast);
    } catch (error) {
      alert(error.message);
      console.error(error);
    }
  }

  // Get user's location and fetch weather
  function getLocationWeather() {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        async (position) => {
          try {
            const { latitude, longitude } = position.coords;
            const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${latitude}&lon=${longitude}&units=metric&appid=${apiKey}`);
            const data = await response.json();
            cityInput.value = data.name;
            handleSearch();
          } catch (error) {
            console.error('Error getting location weather:', error);
            // Default to Delhi if location fails
            cityInput.value = 'Delhi';
            handleSearch();
          }
        },
        (error) => {
          console.error('Geolocation error:', error);
          // Default to Delhi if location is denied
          cityInput.value = 'Delhi';
          handleSearch();
        }
      );
    } else {
      // Default to Delhi if geolocation is not supported
      cityInput.value = 'Delhi';
      handleSearch();
    }
  }

  // Event listeners
  searchBtn.addEventListener('click', handleSearch);
  cityInput.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      handleSearch();
    }
  });

  // Initialize with user's location or default city
  getLocationWeather();
});
</script>
